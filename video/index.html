<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#101210;color:white;font:16px sans-serif}video{display:block;width:100vw;height:100vh}button{position:absolute;inset:0;margin:auto;width:max-content;height:3em;background:#171917dd;color:white;border:1px solid #aaa;border-radius:2em;padding:0 1.4em;cursor:pointer}</style><video controls playsinline></video><button>播放原画</button><script>const v=document.querySelector('video'),b=document.querySelector('button'),id=location.hash.slice(1);if(['home','gym','noodle','desert'].includes(id)){v.poster=id+'/poster.jpg';b.onclick=async()=>{b.disabled=true;try{let m=await(await fetch(id+'/info.json')).json(),parts=[];for(let i=0;i<m.count;i++){b.textContent='载入原片 '+Math.round(i*100/m.count)+'%';let r=await fetch(id+'/'+i+'.bin');if(!r.ok)throw Error();parts.push(await r.blob())}v.src=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));b.hidden=true;await v.play()}catch{b.disabled=false;b.hidden=false;b.textContent='重新载入'}}}</script>
